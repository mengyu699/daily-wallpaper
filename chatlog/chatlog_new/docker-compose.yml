version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: chatlog_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: wechat
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - chatlog_network

  chatlog-server:
    build:
      context: .
      dockerfile: Dockerfile.multi
    container_name: chatlog_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://root:example@mongodb:27017/wechat?authSource=admin
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    volumes:
      - ./data:/app/data:ro
    networks:
      - chatlog_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: chatlog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - chatlog-server
    networks:
      - chatlog_network

volumes:
  mongodb_data:

networks:
  chatlog_network:
    driver: bridge